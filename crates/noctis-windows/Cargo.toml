[package]
name = "noctis-windows"
version = "0.0.0"
description = "Identity-safe discovery and deterministic placement of native Windows windows"
edition = "2021"
rust-version = "1.98"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }

# Pinned to the version Tauri already resolves, so Win32 access adds no new crate
# to the graph — a different major would pull a parallel windows-targets and
# windows-link tree and a second set of import libraries.
[target.'cfg(windows)'.dependencies.windows]
version = "=0.61.3"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
serde_json = "=1.0.151"
