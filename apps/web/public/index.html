<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noctis OS</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <h1>Noctis OS</h1>
      <p class="note">
        Phase 4 canary. The page holds no core token and opens no socket; every line below arrived
        through the Rust shell.
      </p>

      <dl>
        <dt>Core socket</dt>
        <dd id="connection">starting</dd>
        <dt>GET /ready</dt>
        <dd id="ready">waiting</dd>
        <dt>Last deep link</dt>
        <dd id="link">none</dd>
      </dl>

      <button id="notify" type="button">Send a native notification</button>

      <h2>Events</h2>
      <ul id="events"></ul>
    </main>

    <script type="module" src="./shell.js"></script>
  </body>
</html>
