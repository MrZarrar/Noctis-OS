[package]
name = "noctis-desktop"
version = "0.0.0"
description = "Noctis OS desktop shell"
edition = "2021"
rust-version = "1.98"
publish = false

[lib]
name = "noctis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
noctis-windows = { path = "../../../crates/noctis-windows" }
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-deep-link = "=2.4.10"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-notification = "=2.4.0"
tauri-plugin-single-instance = { version = "=2.4.4", features = ["deep-link"] }
# No TLS backend on either client, deliberately. The core is a loopback HTTP
# listener, so a base URL that is not plain HTTP fails to connect rather than
# quietly carrying the bearer token somewhere over the internet.
reqwest = { version = "=0.13.4", default-features = false, features = ["json"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = [
  "connect",
  "handshake",
] }
futures-util = { version = "=0.3.31", default-features = false, features = ["sink"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
url = "=2.5.8"

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread"] }
