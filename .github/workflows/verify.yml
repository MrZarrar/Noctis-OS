name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run test:boundary
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      # Before the E2E suite, not after: it serves the built workspace packages
      # and runs the core from `apps/core/dist`.
      - run: npm run build
      # No `NOCTIS_E2E_BROWSER_CHANNEL` here on purpose — CI proves the gate
      # against the Chromium this Playwright version pins, not against whatever
      # browser a developer machine happens to have installed.
      - run: npx playwright install chromium
      - run: npm run test:e2e

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.2
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - run: npm ci
      # Every cargo command on the desktop crate needs this: `generate_context!`
      # reads the frontend assets at compile time, and `apps/web/dist` is built,
      # not committed.
      - run: npm run build:web
      - run: npm run test:desktop
      - run: npm run rust:fmt:check
      - run: npm run rust:clippy
      - run: npm run rust:test
      - run: npm run build:desktop
